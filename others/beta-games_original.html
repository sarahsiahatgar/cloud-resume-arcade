<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beta! Games - Sarah's AWS Cloud Arcade</title>
  <style>
    /* CSS RESET & FONTS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #b5be8a; /* Sage Green Main Theme */
      color: #2b331f;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }


    /* TOP BAR NAVIGATION */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 40px;
    }

    .nav-links a {
      color: #2b331f;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-right: 20px;
      opacity: 0.8;
      transition: opacity 0.2s;
      
      /* Unified tab sizing */
      display: inline-block;
      min-width: 110px;        
      text-align: center;      
      padding: 8px 12px;       
      box-sizing: border-box;
    }

    .nav-links a:hover, .nav-links a.active {
      opacity: 1;
      text-decoration: underline;
    }

/* CONTAINER FOR EMBEDDED GAME */
    .games-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1100px;
      width: 90%;
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1e2319;
      text-align: center;
    }

    /* RESPONSIVE IFRAME CONTAINER */
    .game-frame-container {
      width: 100%;
      max-width: 860px;
      background-color: #2c3325;
      border-radius: 20px;
      padding: 0;
      box-shadow: none;
      overflow: hidden;
      
      /* Creates a fluid aspect-ratio box that scales down on phones */
      position: relative;
      width: 100%;
      aspect-ratio: 860 / 720; 
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none !important;
      outline: none !important;
      background-color: #2c3325;
      border-radius: 20px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- TOP BAR NAVIGATION -->
  <header>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="games.html">More Games</a>
      <a href="beta-games.html" class="active" style="text-decoration: underline; opacity: 1;">Beta! Games</a>
      <a href="about.html">About</a>
      <a href="https://www.linkedin.com/in/sara-siahatgar-b6a0151b5/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
    <div style="width: 100px;"></div>
  </header>

  <!-- EMBEDDED GAME CONTAINER -->
  <main class="games-container">
    <h2 class="section-title">🎮 Viking II: Fjord Defense (Beta Live View)</h2>
    <div class="game-frame-container">
      <iframe src="viking2.html" title="Viking II Game" scrolling="no"></iframe>
    </div>
  </main>

</body>
</html>
